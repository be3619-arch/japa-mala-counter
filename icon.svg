<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="gradBg" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="50%" stop-color="#F5E0BE"/>
      <stop offset="100%" stop-color="#C25E00"/>
    </radialGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5B2200" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Sacred Ring -->
  <circle cx="256" cy="256" r="236" fill="url(#gradBg)" stroke="url(#gradGold)" stroke-width="16" filter="url(#shadow)"/>

  <!-- Inner Rosary / Mala Beads Pattern around circumference -->
  <g fill="#B45309" opacity="0.45">
    <circle cx="256" cy="50" r="12"/>
    <circle cx="340" cy="72" r="10"/>
    <circle cx="410" cy="130" r="10"/>
    <circle cx="450" cy="210" r="10"/>
    <circle cx="456" cy="290" r="10"/>
    <circle cx="420" cy="370" r="10"/>
    <circle cx="350" cy="430" r="10"/>
    <circle cx="256" cy="460" r="14"/> <!-- Head bead / Sumeru -->
    <circle cx="162" cy="430" r="10"/>
    <circle cx="92" cy="370" r="10"/>
    <circle cx="56" cy="290" r="10"/>
    <circle cx="62" cy="210" r="10"/>
    <circle cx="102" cy="130" r="10"/>
    <circle cx="172" cy="72" r="10"/>
  </g>

  <!-- Central Lotus Motif -->
  <g transform="translate(256, 260) scale(1.15)" text-anchor="middle" dominant-baseline="central">
    <!-- Back Petals -->
    <path d="M0,40 C-80,10 -110,-50 -60,-110 C-30,-70 -10,-10 0,40 Z" fill="#D97706" opacity="0.85"/>
    <path d="M0,40 C80,10 110,-50 60,-110 C30,-70 10,-10 0,40 Z" fill="#D97706" opacity="0.85"/>
    <!-- Outer Side Petals -->
    <path d="M0,40 C-95,-10 -130,-75 -90,-125 C-60,-85 -20,-20 0,40 Z" fill="#B45309" opacity="0.7"/>
    <path d="M0,40 C95,-10 130,-75 90,-125 C60,-85 20,-20 0,40 Z" fill="#B45309" opacity="0.7"/>
    <!-- Center Upright Petal -->
    <path d="M0,40 C-40,-40 -50,-120 0,-155 C50,-120 40,-40 0,40 Z" fill="#92400E"/>
    <!-- Inner Lotus Glow -->
    <path d="M0,40 C-25,-30 -30,-90 0,-120 C30,-90 25,-30 0,40 Z" fill="#FDE68A"/>

    <!-- Sacred Tilak Symbol in Center -->
    <path d="M-10,-50 C-10,-80 -6,-100 0,-112 C6,-100 10,-80 10,-50 C10,-20 -10,-20 -10,-50 Z" fill="#FFFDF7"/>
    <circle cx="0" cy="-25" r="5" fill="#C25E00"/>
  </g>

  <!-- Number 108 subtle badge -->
  <text x="256" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#78350F" letter-spacing="4">108</text>
</svg>
